name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: sigil
                    POSTGRES_PASSWORD: sigil
                    POSTGRES_DB: sigil
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U sigil"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            APP_ENV: test
            DATABASE_URL: "postgresql://sigil:sigil@127.0.0.1:5432/sigil?serverVersion=16&charset=utf8"
            PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
            SOFTHSM2_CONF: /home/runner/softhsm2.conf

        steps:
            - uses: actions/checkout@v5

            # Key custody stack (ADR-005): SoftHSM2 token store, pkcs11-tool
            # (opensc) for keygen, and the python-pkcs11/asn1crypto libs the
            # bin/issue_cert.py driver imports. Tokens live in a runner-owned
            # dir so no group membership games are needed.
            - name: Install PKCS#11 stack
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends softhsm2 opensc python3-pkcs11 python3-asn1crypto
                  mkdir -p /home/runner/softhsm-tokens
                  printf 'directories.tokendir = /home/runner/softhsm-tokens\nobjectstore.backend = file\n' > /home/runner/softhsm2.conf

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, pdo_pgsql, sodium, gd, zip
                  coverage: none

            # .env / .env.test are git-ignored (real values live outside the
            # repo); CI boots from the committed examples. .env.test carries
            # KERNEL_CLASS, which the WebTestCase kernel boot requires.
            - name: Provide env files
              run: |
                  cp .env.example .env
                  cp .env.test.example .env.test

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Audit dependencies
              run: composer audit

            # PHPStan's Symfony extension reads the compiled dev container XML
            # (containerXmlPath in phpstan.dist.neon), so build it first.
            - name: Warm up dev container for PHPStan
              run: php bin/console -e dev cache:warmup

            - name: PHPStan
              run: composer phpstan

            # The functional tests render real pages; without the compiled
            # Tailwind CSS, AssetMapper tries to resolve @import "tailwindcss"
            # as a file asset and every page 500s.
            - name: Build Tailwind CSS
              run: php bin/console tailwind:build --minify

            - name: Prepare test database
              run: |
                  php bin/console -e test doctrine:database:create --if-not-exists -n
                  php bin/console -e test doctrine:migrations:migrate -n

            # The certificate issuance tests exercise the real chain and
            # need an initialized CA (in-token key + var/ca/ca.crt).
            - name: Initialize test CA
              run: php bin/console -e test sigil:ca:init

            - name: PHPUnit
              run: php bin/phpunit
