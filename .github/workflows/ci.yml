name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            # .env is git-ignored (real values live outside the repo); CI boots
            # it from the committed .env.example, which is mounted into the app
            # container. SIGIL_ROOT_KEY is deliberately blank in the template (no
            # real key in git), so generate an ephemeral one per run for the
            # crypto tests (the test env wraps KEKs with this, not the token).
            - name: Provide env file
              run: |
                  cp .env.example .env
                  echo "SIGIL_ROOT_KEY=$(openssl rand -base64 32)" >> .env

            # Build and run everything inside the same image dev uses (Dockerfile:
            # PHP + SoftHSM2 + opensc + pyHanko/fontTools + composer). This keeps
            # CI in lockstep with the image by construction - no re-installing the
            # stack on the runner, so a Dockerfile/CI drift can't silently break
            # signing again.
            #
            # Built via Buildx with a GitHub Actions layer cache: the expensive
            # layers (apk, the pyHanko pip install) are restored across runs and
            # only rebuild when the Dockerfile changes. `load: true` puts the
            # sigil-app:latest tag into the daemon so `docker compose run` (below)
            # reuses it instead of rebuilding.
            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build app image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  tags: sigil-app:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Only the database is needed: the test env uses the local storage
            # backend (not MinIO) and TSA backend "none" (not the tsa service).
            - name: Start database
              run: docker compose up -d --wait db

            # One container, one shell: the app entrypoint (composer install +
            # php -S) is overridden so CI drives each step itself. SoftHSM tokens
            # and var/ come from the app service's volumes, exactly like local.
            - name: Checks and tests
              run: |
                  docker compose run --rm --no-deps -T --entrypoint sh app -c '
                    set -e
                    git config --global --add safe.directory /app
                    composer install --no-interaction --no-progress --prefer-dist
                    composer audit
                    # PHPStan reads the compiled dev container XML (phpstan.dist.neon).
                    php bin/console -e dev cache:warmup
                    composer phpstan
                    # Functional tests render real pages; without compiled Tailwind,
                    # AssetMapper 500s on @import "tailwindcss".
                    php bin/console tailwind:build --minify
                    php bin/console -e test doctrine:database:create --if-not-exists -n
                    php bin/console -e test doctrine:migrations:migrate -n
                    # Certificate/signing tests need an initialized CA (in-token key
                    # + var/ca/ca.crt).
                    php bin/console -e test sigil:ca:init
                    php bin/phpunit
                  '

            - name: Tear down
              if: always()
              run: docker compose down -v
