name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    # On a push to master, skips the tests when they already passed on exactly
    # this code: the merged PR's CI recorded the git tree it tested, and master's
    # new tree is identical. Anything else (a direct push, a PR that went stale
    # behind master, a missing record) runs CI before deploying.
    gate:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
            actions: read
        outputs:
            tested: ${{ steps.check.outputs.tested }}
        steps:
            - id: check
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
              run: |
                  tested=false
                  tree=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.tree.sha')
                  head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                      --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
                  if [ -n "$head" ]; then
                      run=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&status=success" \
                          --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | sort_by(.created_at) | last | .id // empty')
                      if [ -n "$run" ] && gh run download "$run" -R "$REPO" -n tested-tree -D record; then
                          [ "$(cat record/tested-tree)" = "$tree" ] && tested=true
                      fi
                  fi
                  echo "master tree $tree, PR head ${head:-none}, PR run ${run:-none} -> tested=$tested"
                  echo "tested=$tested" >> "$GITHUB_OUTPUT"

    # Dependency advisories, beside the tests: needs only the lock files, so it
    # skips the image build. Same skip rule as ci; deploy waits for both.
    audit:
        needs: gate
        if: ${{ !cancelled() && needs.gate.outputs.tested != 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Audit PHP dependencies
              run: docker run --rm -v "$PWD":/app -w /app composer:latest audit --locked

            # The Python drivers' dependencies are pinned in requirements.txt.
            - name: Audit Python dependencies
              run: pipx run pip-audit --strict -r requirements.txt

    ci:
        needs: gate
        if: ${{ !cancelled() && needs.gate.outputs.tested != 'true' }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            # .env is git-ignored (real values live outside the repo); CI boots
            # it from the committed .env.example, which is mounted into the app
            # container. SIGIL_ROOT_KEY is deliberately blank in the template (no
            # real key in git), so generate an ephemeral one per run for the
            # crypto tests (the test env wraps KEKs with this, not the token).
            - name: Provide env file
              run: |
                  cp .env.example .env
                  echo "SIGIL_ROOT_KEY=$(openssl rand -base64 32)" >> .env

            # Build and run everything inside the same image dev uses (Dockerfile:
            # PHP + kryoptic (built from source, ADR-014) + opensc + pyHanko + composer). This keeps
            # CI in lockstep with the image by construction - no re-installing the
            # stack on the runner, so a Dockerfile/CI drift can't silently break
            # signing again.
            #
            # Built via Buildx with a GitHub Actions layer cache: the expensive
            # layers (apk, the kryoptic cargo build, the pyHanko pip install) are
            # restored across runs and only rebuild when the Dockerfile changes. `load: true` puts the
            # sigil-app:latest tag into the daemon so `docker compose run` (below)
            # reuses it instead of rebuilding.
            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build app image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: sigil-app:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Only the database is needed: the test env uses the local storage
            # backend (not MinIO) and TSA backend "none" (not the tsa service).
            - name: Start database
              run: docker compose up -d --wait db

            # One container, one shell: the app entrypoint (composer install +
            # php -S) is overridden so CI drives each step itself. kryoptic tokens
            # and var/ come from the app service's volumes, exactly like local.
            - name: Checks and tests
              run: |
                  docker compose run --rm --no-deps -T --entrypoint sh app -c '
                    set -e
                    git config --global --add safe.directory /app
                    composer install --no-interaction --no-progress --prefer-dist
                    # PHPStan reads the compiled dev container XML (phpstan.dist.neon).
                    php bin/console -e dev cache:warmup
                    composer phpstan
                    # Functional tests render real pages; without compiled Tailwind,
                    # AssetMapper 500s on @import "tailwindcss".
                    php bin/console tailwind:build --minify
                    # One database per ParaTest worker (sigil_test1..4, via
                    # TEST_TOKEN). Worker 1 also provisions the shared CA, seal and
                    # archive tokens; the rest only need their schema.
                    TEST_TOKEN=1 sh docker/bootstrap.sh test
                    pids=""
                    for t in 2 3 4; do TEST_TOKEN=$t sh docker/bootstrap.sh test & pids="$pids $!"; done
                    for p in $pids; do wait $p; done
                    echo "nproc: $(nproc)"
                    time vendor/bin/paratest --processes=4
                  '

            # What this PR run tested: the tree of the PR merged into master. The
            # gate compares it with master after the merge to skip a re-run.
            - name: Record tested tree
              if: github.event_name == 'pull_request'
              run: git rev-parse 'HEAD^{tree}' > tested-tree

            - name: Upload tested tree
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: tested-tree
                  path: tested-tree
                  retention-days: 30

            - name: Tear down
              if: always()
              run: docker compose down -v

    # Ships the tested commit to the VPS: right away when its PR already passed,
    # after `ci` otherwise. The key is a forced command on the server
    # (sigil-deploy): it can deploy a master SHA and nothing else.
    deploy:
        needs: [gate, audit, ci]
        if: >-
            !cancelled()
            && github.event_name == 'push' && github.ref == 'refs/heads/master'
            && ((needs.ci.result == 'success' && needs.audit.result == 'success')
                || (needs.gate.result == 'success' && needs.gate.outputs.tested == 'true'))
        runs-on: ubuntu-latest
        environment: production
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        timeout-minutes: 30

        steps:
            - name: Deploy
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
                  DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
                  chmod 600 ~/.ssh/deploy
                  ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
                      -o StrictHostKeyChecking=yes \
                      "$DEPLOY_TARGET" "$GITHUB_SHA"
