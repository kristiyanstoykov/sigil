services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigil-app:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/var
      - softhsm_tokens:/var/lib/softhsm/tokens
    environment:
      APP_ENV: dev
      APP_SECRET: "${APP_SECRET:-sigil_dev_secret_change_in_production}"
      DATABASE_URL: "postgresql://sigil:sigil@db:5432/sigil?serverVersion=16&charset=utf8"
      # MAILER_DSN is intentionally NOT set here: it carries a secret Brevo API key,
      # so it is provided via .env.local (bind-mounted into the container). A container
      # env var would override .env.local. Falls back to null://null from .env otherwise.
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      # Live notifications (ADR-013). The app publishes container-internally; the
      # browser subscribes to the host-exposed address, which .env already holds.
      # The port is not optional: the hub listens on 3000 inside the network too,
      # so a portless URL here silently tries 80 and every push fails.
      MERCURE_URL: "http://mercure:3000/.well-known/mercure"
      SOFTHSM2_CONF: /etc/softhsm2.conf
      PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      # Object storage (ADR-004/009). Active backend comes from .env (dev=minio)
      # / .env.test (test=local) - NOT overridden here, so tests inside the
      # container still use the local backend. Only the endpoint must point at
      # the compose service instead of localhost.
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_REGION: us-east-1
      MINIO_BUCKET: sigil-documents
      MINIO_ACCESS_KEY: sigil
      MINIO_SECRET_KEY: sigil_minio_dev
      # AWS_* (real S3) are provided via .env.local when you want to test AWS,
      # then flip SIGIL_STORAGE_ACTIVE_BACKEND=aws. Never commit real creds.
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      mercure:
        condition: service_started

  # Local RFC-3161 timestamp responder (dev). Gives fast, offline PAdES-B-T
  # timestamps so signing does not wait on a public TSA. Reuses the app image
  # (has openssl + python3); the app talks to it at http://tsa:8318 when
  # SIGIL_TSA_ACTIVE_BACKEND=local_uts. See docker/tsa/.
  tsa:
    image: sigil-app:latest
    # Built by the app service; never try to pull it from a registry.
    pull_policy: never
    entrypoint: ["/tsa-src/entrypoint.sh"]
    volumes:
      - ./docker/tsa:/tsa-src:ro
      - tsa_data:/tsa
    depends_on:
      app:
        condition: service_started

  # Mercure hub - the live half of the notification inbox (ADR-013). A separate
  # Go process because an SSE stream held open in PHP would pin the single
  # `php -S` worker and stall the whole app. It holds no state worth keeping: the
  # notification itself is a row in Postgres, and the browser re-reads from there
  # on every nudge, so restarting the hub loses nothing.
  mercure:
    image: dunglas/mercure:latest
    environment:
      SERVER_NAME: ":3000"
      # auto_https off: dev serves plain HTTP on localhost.
      GLOBAL_OPTIONS: "auto_https off"
      MERCURE_PUBLISHER_JWT_KEY: "sigil_dev_mercure_jwt_secret_change_in_production"
      MERCURE_SUBSCRIBER_JWT_KEY: "sigil_dev_mercure_jwt_secret_change_in_production"
      # No `anonymous` directive on purpose: every subscriber must present the
      # cookie the app signed, or the inbox topics would be world-readable.
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (http://localhost:9001, sigil / sigil_minio_dev)
    environment:
      MINIO_ROOT_USER: sigil
      MINIO_ROOT_PASSWORD: sigil_minio_dev
    volumes:
      - minio_data:/data

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: sigil
      POSTGRES_USER: sigil
      POSTGRES_PASSWORD: sigil
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "sigil", "-U", "sigil"]
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  db_data:
  softhsm_tokens:
  minio_data:
  tsa_data:

