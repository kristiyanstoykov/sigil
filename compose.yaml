services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/var
      - softhsm_tokens:/var/lib/softhsm/tokens
    environment:
      APP_ENV: dev
      APP_SECRET: "${APP_SECRET:-sigil_dev_secret_change_in_production}"
      DATABASE_URL: "postgresql://sigil:sigil@db:5432/sigil?serverVersion=16&charset=utf8"
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      SOFTHSM2_CONF: /etc/softhsm2.conf
      PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: sigil
      POSTGRES_USER: sigil
      POSTGRES_PASSWORD: sigil
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "sigil", "-U", "sigil"]
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
  softhsm_tokens:
