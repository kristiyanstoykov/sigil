services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigil-app:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/var
      - kryoptic_tokens:/var/lib/kryoptic
      # Caddy's certificates and state (FrankenPHP). Unused on plain-HTTP dev,
      # load-bearing in prod: without it every restart re-issues certificates.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_ENV: dev
      # FrankenPHP site address: a bare port = plain HTTP, no certificate.
      SERVER_NAME: ":8000"
      APP_SECRET: "${APP_SECRET:-sigil_dev_secret_change_in_production}"
      DATABASE_URL: "postgresql://sigil:sigil@db:5432/sigil?serverVersion=16&charset=utf8"
      # MAILER_DSN is intentionally NOT set here: it carries a secret Brevo API key,
      # so it is provided via .env.local (bind-mounted into the container). A container
      # env var would override .env.local. Falls back to null://null from .env otherwise.
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      # Live notifications (ADR-013). The app publishes container-internally; the
      # browser subscribes through Caddy on the app's own origin (the Caddyfile
      # proxies /.well-known/mercure to the hub). The port on MERCURE_URL is not
      # optional: the hub listens on 3000, so a portless URL silently tries 80.
      MERCURE_URL: "http://mercure:3000/.well-known/mercure"
      MERCURE_PUBLIC_URL: "http://localhost:8000/.well-known/mercure"
      KRYOPTIC_CONF: /var/lib/kryoptic/token.conf
      PKCS11_MODULE: /usr/lib/libkryoptic_pkcs11.so
      # Object storage (ADR-004/009). Active backend comes from .env / .env.test
      # (test=local) - NOT overridden here, so tests inside the container still
      # use the local backend. MinIO is opt-in (`--profile minio`, below); these
      # only point its backend at the compose service instead of localhost.
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_REGION: us-east-1
      MINIO_BUCKET: sigil-documents
      MINIO_ACCESS_KEY: sigil
      MINIO_SECRET_KEY: sigil_minio_dev
      # AWS_* (real S3) are provided via .env.local when you want to test AWS,
      # then flip SIGIL_STORAGE_ACTIVE_BACKEND=aws. Never commit real creds.
    depends_on:
      db:
        condition: service_healthy
      mercure:
        condition: service_started

  # Local RFC-3161 timestamp responder (dev). Gives fast, offline PAdES-B-T
  # timestamps so signing does not wait on a public TSA. Reuses the app image
  # (has openssl + python3); the app talks to it at http://tsa:8318 when
  # SIGIL_TSA_ACTIVE_BACKEND=local_uts. See docker/tsa/.
  tsa:
    image: sigil-app:latest
    # Built by the app service; never try to pull it from a registry.
    pull_policy: never
    entrypoint: ["/tsa-src/entrypoint.sh"]
    volumes:
      - ./docker/tsa:/tsa-src:ro
      - tsa_data:/tsa
    depends_on:
      app:
        condition: service_started

  # Mercure hub - the live half of the notification inbox (ADR-013). A separate
  # Go process, reached by browsers through the app's Caddy (same origin), so an
  # SSE stream never holds a PHP thread. It holds no state worth keeping: the
  # notification itself is a row in Postgres, and the browser re-reads from there
  # on every nudge, so restarting the hub loses nothing.
  mercure:
    # Protocol 1.0 (config/packages/mercure.yaml). Pinned, and the same tag as
    # MERCURE_IMAGE_TAG in prod: a hub upgrade is a protocol decision, not a pull.
    image: dunglas/mercure:v1.0.2
    environment:
      SERVER_NAME: ":3000"
      # auto_https off: dev serves plain HTTP on localhost.
      GLOBAL_OPTIONS: "auto_https off"
      # The one token issuer the hub trusts: the app's iss claim (DEFAULT_URI).
      MERCURE_TRUSTED_ISSUERS: "http://localhost:8000"
      MERCURE_PUBLISHER_JWT_KEY: "sigil_dev_mercure_jwt_secret_change_in_production"
      MERCURE_SUBSCRIBER_JWT_KEY: "sigil_dev_mercure_jwt_secret_change_in_production"
      # No `anonymous` directive on purpose: every subscriber must present the
      # cookie the app signed, or the inbox topics would be world-readable.
      # resource_identifier pins the token audience to the public URL, which the
      # app also publishes under from inside the network. The cookie drops its
      # __Secure- prefix because dev is plain HTTP.
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8000
        resource_identifier http://localhost:8000/.well-known/mercure
        cookie_name mercure_access_token

  # Opt-in S3-compatible store for offline dev: `docker compose --profile minio up`
  # with SIGIL_STORAGE_ACTIVE_BACKEND=minio. Off by default - AWS S3 is the
  # backend in use - and absent in prod. Documents written while it was active
  # stay readable only while it runs (reads route by the backend in the key).
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (http://localhost:9001, sigil / sigil_minio_dev)
    environment:
      MINIO_ROOT_USER: sigil
      MINIO_ROOT_PASSWORD: sigil_minio_dev
    volumes:
      - minio_data:/data

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: sigil
      POSTGRES_USER: sigil
      POSTGRES_PASSWORD: sigil
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "sigil", "-U", "sigil"]
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  db_data:
  caddy_data:
  caddy_config:
  kryoptic_tokens:
  # Pre-ADR-014 SoftHSM tokens. Kept only so docker/migrate-softhsm.sh can read
  # them; nothing mounts it any more. Remove once every environment has migrated.
  softhsm_tokens:
  minio_data:
  tsa_data:

