# SoftHSM2 configuration for the Sigil app container.
# Token store is mounted as a named Docker volume so user tokens persist
# across container rebuilds. In production, point PKCS11_MODULE at the
# vendor's PKCS#11 library instead — no application code changes (ADR-005).
directories.tokendir = /var/lib/softhsm/tokens/
objectstore.backend = file
log.level = INFO
slots.removable = false
slots.mechanisms = ALL
