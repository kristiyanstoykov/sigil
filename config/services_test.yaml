services:
    # No hub runs during the suite. Decorate rather than replace, so the
    # subscriber-cookie path is still the real one and only publishing is cut.
    App\Tests\Support\RecordingHub:
        decorates: mercure.hub.default
        arguments: ['@.inner']
        public: true

    # No controller reaches the deleter until the deletion page exists.
    App\Account\Service\AccountDeleter:
        autowire: true
        public: true
