# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Where document ciphertext blobs live (ADR-004). Override with the
    # SIGIL_DOCUMENT_STORAGE_PATH env var (e.g. a mounted volume) in prod.
    default_document_storage_path: '%kernel.project_dir%/var/documents'

    # Max uploadable document size (ADR-006). 10 MiB - files are buffered whole
    # in memory for AEAD at this size. Single source of truth for the upload flow.
    app.max_document_size_bytes: 10485760

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Configured per-instance below (minio/aws) - not a single autowired service
            - '../src/Document/Service/S3StorageBackend.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # AuditLog: single write entry point for the hash-chained audit log
    App\AuditLog\AuditLoggerInterface: '@App\AuditLog\Service\DoctrineAuditLogger'

    # Crypto: the only symmetric-crypto entry point (ADR-004/006)
    App\Core\Crypto\EncryptionServiceInterface: '@App\Core\Crypto\EnvelopeEncryptionService'

    # Document storage (ADR-009): the app depends on the routing facade, which
    # dispatches to the backend stamped into each storage key.
    App\Document\Service\DocumentStorageInterface: '@App\Document\Service\RoutingDocumentStorage'

    # Storage backend: MinIO (dev, S3-compatible). Tagged app.storage_backend
    # automatically via the interface's Autoconfigure attribute.
    storage.backend.minio:
        class: App\Document\Service\S3StorageBackend
        arguments:
            $id: 'minio'
            $endpoint: '%env(MINIO_ENDPOINT)%'
            $region: '%env(MINIO_REGION)%'
            $bucket: '%env(MINIO_BUCKET)%'
            $accessKey: '%env(MINIO_ACCESS_KEY)%'
            $secretKey: '%env(MINIO_SECRET_KEY)%'
            $pathStyleEndpoint: true

    # Storage backend: real AWS S3. Dormant until AWS_* are supplied (lazy client);
    # activate with SIGIL_STORAGE_ACTIVE_BACKEND=aws.
    storage.backend.aws:
        class: App\Document\Service\S3StorageBackend
        arguments:
            $id: 'aws'
            $endpoint: '%env(AWS_ENDPOINT)%'
            $region: '%env(AWS_REGION)%'
            $bucket: '%env(AWS_BUCKET)%'
            $accessKey: '%env(AWS_ACCESS_KEY_ID)%'
            $secretKey: '%env(AWS_SECRET_ACCESS_KEY)%'
            $pathStyleEndpoint: false

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\AuditLog\Service\DoctrineAuditLogger:
            public: true

        App\Certificate\Service\CertificateIssuer:
            public: true

        App\Certificate\Service\Pkcs11TokenManager:
            public: true

        App\Certificate\Service\PinGate:
            public: true

        App\Document\Service\KeyManagementService:
            public: true

        App\Document\Service\DocumentUploader:
            public: true

        App\Document\Service\DocumentDownloader:
            public: true

        App\Document\Service\DocumentStorageInterface:
            alias: App\Document\Service\RoutingDocumentStorage
            public: true

        App\Document\Service\StorageKeyGenerator:
            public: true

        App\Document\Repository\UserEncryptionKeyRepository:
            public: true

        App\Document\Repository\DocumentRepository:
            public: true

        App\Document\Repository\DocumentKeyGrantRepository:
            public: true
