# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Absolute URLs in emails (verification links, notifications) are built from
    # the request's Host header, so a proxy that forwards any Host would let a
    # stranger mint links to a host of their choosing. One regex the Host must
    # match; an empty value matches any host (dev only), production sets it
    # (see .env.example).
    trusted_hosts: '%env(TRUSTED_HOSTS)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        enabled: true
        # Hardened cookie flags. httponly is the Symfony default; secure: auto
        # sends the Secure flag whenever the request is HTTPS.
        cookie_secure: auto
        cookie_samesite: lax
        # Server-side GC backstop, aligned with the 30-minute idle timeout that
        # SessionTimeoutSubscriber enforces (plus 2h absolute lifetime).
        gc_maxlifetime: 1800

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
