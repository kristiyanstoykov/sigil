# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        enabled: true
        # Hardened cookie flags. httponly is the Symfony default; secure: auto
        # sends the Secure flag whenever the request is HTTPS.
        cookie_secure: auto
        cookie_samesite: lax
        # Server-side GC backstop, aligned with the 30-minute idle timeout that
        # SessionTimeoutSubscriber enforces (plus 2h absolute lifetime).
        gc_maxlifetime: 1800

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
