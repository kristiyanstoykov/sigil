# See the configuration reference at https://symfony.com/bundles/SchebTwoFactorBundle/6.x/configuration.html
scheb_two_factor:
    google:
        enabled: true
        issuer: "Sigil. Signum Veritatis"
        digits: 6
        # Seconds of tolerance each side of the current 30s slot (otphp checks the
        # code at now-leeway, now, now+leeway; must be < the 30s period). 1s was far
        # too strict — a correct code failed on any slot rollover or phone-clock skew.
        # 29 ≈ the standard RFC 6238 §5.2 ±1 time-step window.
        leeway: 29
        template: "auth/2fa_login.html.twig"

    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
