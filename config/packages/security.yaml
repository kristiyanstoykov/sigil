security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Core\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Auth\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
                username_parameter: email
                password_parameter: password
            login_throttling:
                max_attempts: 5          # failed attempts per interval, keyed on (IP + username)
                interval: '15 minutes'   # window before the counter resets; a broader IP-only limiter (5x) also applies
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                default_target_path: app_dashboard

    access_control:
        - { path: ^/logout$, roles: PUBLIC_ACCESS }   # must be reachable mid-2FA (TwoFactorToken is not FULLY authenticated)
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/verify/, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/2fa$, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/2fa_check, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/assets, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
