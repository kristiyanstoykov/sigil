framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Mail is sent synchronously (transactional auth emails must go out
            # immediately; the worker only builds data exports). Only the dedicated
            # App\...\Message classes are routed async — see messenger.yaml notes
            # in CLAUDE.md. Do NOT route SendEmailMessage to async without a worker.
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Built by the worker service (ADR-015 §7). The message carries the
            # export id only - never a secret.
            'App\Account\Message\BuildDataExport': async

when@test:
    framework:
        messenger:
            transports:
                # Tests run the handler themselves; nothing reaches the database queue.
                async: 'in-memory://'
