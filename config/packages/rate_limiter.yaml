# Named rate limiters (symfony/rate-limiter). Login throttling is configured
# separately on the firewall (security.yaml → login_throttling).
framework:
    rate_limiter:
        # Resending the verification email: keyed on email + client IP in the
        # controller. Sliding window so a burst can't be repeated at the edge.
        resend_verification:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

        # Any endpoint that verifies a certificate PIN (change-PIN and
        # document signing). Keyed per user in the controller. This is the
        # DoS/brute-force shield in FRONT of the ADR-008 Argon2id gate —
        # the gate's own 5-failures/hour lockout is the second layer.
        pin_verification:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

        # The signer / recipient pickers answer "does this email have an
        # account, and can it be used" - a deliberate trade for a usable picker,
        # so the caller is paced to stop it being an enumeration tool. Keyed per
        # user (they are authenticated).
        directory_lookup:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'

        # Certificate issuance is expensive (token init + keygen + CA
        # signature) — keep it human-paced. Keyed per user.
        certificate_issue:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

        # Unlock attempts prove password + TOTP; throttle guessing. Keyed per user.
        certificate_unlock:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        # Verifying a file against a receipt's fingerprint. Only grant holders
        # can ask, so this is pacing rather than a defence - but a yes/no over
        # uploaded bytes is still an oracle, and the answer is audited each
        # time. Keyed per user.
        # Data exports decrypt everything a user holds in the worker; a few a
        # day is plenty. Keyed per user.
        data_export:
            policy: sliding_window
            limit: 5
            interval: '1 day'

        receipt_verification:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'

        # Deleting an account re-proves password + TOTP; throttle guessing on a
        # hijacked session. Keyed per user.
        account_deletion:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        # The restore link mailed when a deleted address registers again. Keyed
        # on the address's fingerprint, so a stranger cannot flood its inbox.
        account_restore_link:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

        # Recovery-code attempts on the restore page (ADR-015 §4). Keyed on the
        # account id: the code is ~100 bits, this keeps the log readable.
        account_recovery:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
