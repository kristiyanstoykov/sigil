symfonycasts_tailwind:
    # Pin the exact Tailwind CSS standalone binary (no Node). Our input
    # assets/styles/app.css is a UTILITIES-ONLY build (no Preflight): Able Pro's
    # precompiled assets/able-pro/css/style.css supplies Preflight + components,
    # and this build regenerates the utility classes our templates use (Able
    # Pro's precompiled CSS only shipped ~57% of them).
    binary_version: 'v4.1.11'
