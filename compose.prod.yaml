# Production overrides - a hardening skeleton, not a turnkey deployment.
#
#   cp .env.prod.example .env && chmod 600 .env    # then fill every blank
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# The server's .env is the one place the deployment is configured: compose
# reads it for the ${...:?} checks below, and Symfony reads the same file
# inside the container. Never copy a dev .env to the server.
#
# What it changes against the dev file: APP_ENV=prod with debug off, restart on
# boot (unattended-upgrades reboots the host at night), no host ports on the
# database / Mercure, image tags you pin explicitly, AWS S3 as the only object
# store (no MinIO), no local TSA unless asked for, and every secret read from
# the environment with no dev fallback.
# HTTPS: FrankenPHP's Caddy obtains and renews a Let's Encrypt certificate for
# SERVER_NAME by itself, so the domain's DNS must point here and 80/443 must be
# open before the first start. Certificates persist on the caddy_data volume.
# What it does NOT do, and a real deployment must: ship
# SIGIL_AUDIT_ANCHOR_PATH and the kryoptic_tokens volume off the host; run the
# container as a non-root user (the entrypoint's `composer install` and the
# token volume's ownership are what stand in the way today).
services:
  app:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:?set APP_SECRET}"
      SERVER_NAME: "${SERVER_NAME:?set SERVER_NAME to the bare domain, e.g. sigil.example.com}"
      CADDY_GLOBAL_OPTIONS: "${CADDY_GLOBAL_OPTIONS:-}"
      DATABASE_URL: "postgresql://sigil:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/sigil?serverVersion=16&charset=utf8"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:?set TRUSTED_HOSTS, e.g. ^sigil\\.example\\.com$}"
      DEFAULT_URI: "${DEFAULT_URI:?set DEFAULT_URI, e.g. https://sigil.example.com}"
      MERCURE_PUBLIC_URL: "${MERCURE_PUBLIC_URL:?set MERCURE_PUBLIC_URL}"
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:?set MERCURE_JWT_SECRET}"
      MAILER_DSN: "${MAILER_DSN:?set MAILER_DSN - invited users cannot verify their email without it}"
      MAILER_FROM: "${MAILER_FROM:?set MAILER_FROM to a sender verified with the mail provider}"
      SIGIL_ROOT_KEY: "${SIGIL_ROOT_KEY:?set SIGIL_ROOT_KEY - it seals TOTP seeds and MACs fingerprints and audit anchors}"
      SIGIL_ROOT_TOKEN_PIN: "${SIGIL_ROOT_TOKEN_PIN:?set SIGIL_ROOT_TOKEN_PIN}"
      SIGIL_CA_PIN: "${SIGIL_CA_PIN:?set SIGIL_CA_PIN}"
      SIGIL_SEAL_PIN: "${SIGIL_SEAL_PIN:?set SIGIL_SEAL_PIN}"
      SIGIL_STORAGE_ACTIVE_BACKEND: aws
      AWS_REGION: "${AWS_REGION:?set AWS_REGION}"
      AWS_BUCKET: "${AWS_BUCKET:?set AWS_BUCKET}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID - a key scoped to this one bucket}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}"
      SIGIL_TSA_ACTIVE_BACKEND: "${SIGIL_TSA_ACTIVE_BACKEND:?set SIGIL_TSA_ACTIVE_BACKEND (freetsa, or local_uts with --profile local-tsa)}"
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    depends_on: !override
      db:
        condition: service_healthy
      mercure:
        condition: service_started

  # The self-hosted responder signs with a key on this same host, so it proves
  # little about time; FreeTSA is the default. Opt in with --profile local-tsa.
  tsa:
    profiles: ["local-tsa"]
    restart: unless-stopped

  mercure:
    image: "dunglas/mercure:${MERCURE_IMAGE_TAG:?pin a Mercure release tag}"
    restart: unless-stopped
    environment:
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET:?set MERCURE_JWT_SECRET}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET:?set MERCURE_JWT_SECRET}"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${DEFAULT_URI:?set DEFAULT_URI}
    ports: !override []
    expose:
      - "3000"

  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    ports: !override []
